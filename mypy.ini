# mypy configuration for VS Code's Mypy extension (runs from the project root).
# The backend package "app" lives in backend/, so tell mypy where to find it —
# without this every "from app.xxx import ..." shows "import-not-found".
[mypy]
mypy_path = backend
explicit_package_bases = True
python_version = 3.13
# Third-party libraries without type stubs (groq, faiss, slowapi, ...)
ignore_missing_imports = True
exclude = (^|/)(\.venv|frontend|node_modules|\.mypy_cache|\.pytest_cache)/
