# Render Blueprint — deploys the FastAPI backend + a Postgres database.
# Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: sqlanalyst-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sqlanalyst-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TARGET_DB_URL
        value: sqlite:///./data/analytics.db
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: RATE_LIMIT_ENABLED
        value: "true"
      # Set these in the dashboard (sync: false = you are prompted for a value)
      - key: APP_URL            # e.g. https://sqlanalyst-api.onrender.com
        sync: false
      - key: FRONTEND_URL       # e.g. https://sqlanalyst.vercel.app
        sync: false
      - key: CORS_ORIGINS       # same as FRONTEND_URL
        sync: false
      - key: DB_ENCRYPTION_KEY  # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEFAULT_ADMIN_EMAIL
        sync: false
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: sqlanalyst-db
    databaseName: sqlanalyst
    plan: free
